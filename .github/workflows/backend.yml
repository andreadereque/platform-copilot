name: backend
on:
  pull_request:
    paths: ["backend/**", "db/**", "seed/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "db/**", "seed/**", ".github/workflows/backend.yml"]
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: backend
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/platform_copilot_test
      TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy src tests
      - name: No ternaries
        run: |
          if grep -rnE "\bif\b.+\belse\b" src tests --include=*.py | grep -vE "^\S+:[0-9]+:\s*(if|elif|else)\b"; then
            echo "Conditional expressions are not allowed"; exit 1
          fi
      - name: Tests (100% coverage)
        run: uv run pytest
