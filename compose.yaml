# Everything in containers, for machines with Docker. Models are pulled on first start of ollama:
#   docker compose up -d && docker compose exec ollama ollama pull qwen2.5:3b
#   docker compose exec ollama ollama pull nomic-embed-text
services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: platform_copilot
      POSTGRES_HOST_AUTH_METHOD: trust   # local practice only
    ports: ["5432:5432"]
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql
  ollama:
    image: ollama/ollama
    ports: ["11434:11434"]
    volumes: ["ollama-models:/root/.ollama"]
volumes:
  pgdata:
  ollama-models:
