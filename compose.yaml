# Everything but the API and the UI in containers, for machines with Docker.
# Models are pulled on first start of ollama:
#   docker compose up -d && docker compose exec ollama ollama pull qwen2.5:3b
#   docker compose exec ollama ollama pull nomic-embed-text
services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: platform_copilot
      POSTGRES_HOST_AUTH_METHOD: trust   # local practice only
    ports: ["5432:5432"]
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql
  # Identity provider (OIDC). The realm (fake users from seed/users.json, their groups, the web
  # client with PKCE) is imported on start. Admin console: http://localhost:8080 (admin/admin).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin   # local practice only
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
  ollama:
    image: ollama/ollama
    ports: ["11434:11434"]
    volumes: ["ollama-models:/root/.ollama"]
volumes:
  pgdata:
  ollama-models:
